name: Bug Report
description: Report a bug or unexpected behavior
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Type
      description: How are you running the application?
      options:
        - Web app (browser)
        - Desktop app (Tauri)
        - Docker
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Select '...'
        3. Click '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Output of `node --version`.
      placeholder: 'v24.x.x'
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: 'macOS 15.3 / Ubuntu 24.04 / Windows 11'
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: 'Chrome 131 / Firefox 134 / Safari 18'
    validations:
      required: false

  - type: input
    id: libreoffice
    attributes:
      label: LibreOffice Version
      description: Output of `libreoffice --version` (only relevant for .doc export or template prep issues).
      placeholder: 'LibreOffice 25.2.1'
    validations:
      required: false
