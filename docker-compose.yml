x-shared-env: &shared-env
  - NODE_ENV=production
  - PORT=3000
  - HOST=0.0.0.0
  - ORIGIN=${ORIGIN:-http://localhost:3000}
  - PUBLIC_DEFAULT_COMPANY_CODE=${PUBLIC_DEFAULT_COMPANY_CODE:-}
  - PUBLIC_DEFAULT_EMPLOYEE_NAME=${PUBLIC_DEFAULT_EMPLOYEE_NAME:-}
  - PUBLIC_DEFAULT_EMPLOYEE_ID=${PUBLIC_DEFAULT_EMPLOYEE_ID:-}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LIBREOFFICE: 'false'
    ports:
      - '${PORT:-3000}:3000'
    environment: *shared-env
    restart: unless-stopped

  app-full:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LIBREOFFICE: 'true'
    ports:
      - '${PORT:-3000}:3000'
    environment: *shared-env
    restart: unless-stopped
    profiles:
      - full
