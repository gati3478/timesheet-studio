[package]
name = "timesheet-studio"
version = "1.0.1"
description = "Georgian-format monthly timesheet generator — desktop app"
authors = ["Giorgi Petriashvili"]
license = "MIT"
repository = "https://github.com/gati3478/timesheet-studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "timesheet_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
